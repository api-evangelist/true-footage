aid: true-footage
name: True Footage
description: >-
  True Footage is a US residential real estate valuation company that pairs staff appraisers
  with proprietary analytics software, founded in 2021 and operating as a distributed team
  across appraisal markets nationwide. It runs two connected businesses: an appraisal services
  arm producing purchase, refinance, HELOC, FHA/VA, PMI-removal, tax-appeal, divorce and
  date-of-death valuations for lenders, AMCs, investors and homeowners; and an appraiser
  software arm selling TrueTracts, Spark and Synapse — a subscription console that automates
  market definition, comparable selection, time and feature adjustments using generalized
  additive models, heat-mapped location similarity and 1004MC form completion, and exports a
  PDF workfile. TrueTracts is sold at $49 and $99 per month and integrates with the TOTAL,
  ACI and ClickFORMS form fillers. The company has raised roughly $119M. There is no public
  developer program: the platform APIs are real and reachable but reject every unauthenticated
  request, and no OpenAPI, developer portal or API reference is published.
