apis:
- aid: true-footage:truetracts-api
  name: TrueTracts API
  description: >-
    Backend API for the TrueTracts appraiser console — the subscription platform that performs
    market definition, comparable selection, time and feature adjustments, heat mapping and
    1004MC generation for residential appraisers. The host is live and production, but every
    path, including /openapi.json, /docs and every /.well-known/ path, returns HTTP 401
    {"detail":"authorization header is expected"}. Only /health answers anonymously. Access is
    obtained through a TrueTracts subscription and Auth0 sign-in, not through a developer program.
  humanURL: https://www.truefootage.tech/tools/truetracts
