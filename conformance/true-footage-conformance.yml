standards:
  - id: oidc
    name: OpenID Connect Discovery 1.0
    conforms: true
    evidence: >-
      Both identity hosts serve a complete, correctly-typed
      /.well-known/openid-configuration (HTTP 200, application/json) carrying issuer,
      authorization_endpoint, token_endpoint, userinfo_endpoint, jwks_uri,
      response_types_supported, subject_types_supported and
      id_token_signing_alg_values_supported.
    urls:
      - https://auth.truetracts.truefootage.tech/.well-known/openid-configuration
      - https://auth.trueengine.truefootage.tech/.well-known/openid-configuration
    note: >-
      The conformance is inherited from the Auth0 tenants True Footage runs under its own
      custom domains, not from software True Footage authored.
  - id: oauth2
    name: OAuth 2.0 (RFC 6749) + Authorization Server Metadata (RFC 8414)
    conforms: true
    evidence: >-
      /.well-known/oauth-authorization-server returns 200 on the TrueTracts identity host
      with the RFC 8414 metadata set. authorization_code, client_credentials,
      refresh_token, device_code and token-exchange grants are advertised.
    urls:
      - https://auth.truetracts.truefootage.tech/.well-known/oauth-authorization-server
  - id: pkce
    name: 'OAuth 2.0 PKCE (RFC 7636)'
