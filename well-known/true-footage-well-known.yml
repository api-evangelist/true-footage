generated: '2026-08-05'
method: probed
description: >-
  Results of probing the /.well-known/ discovery surface for every True Footage host
  reachable without credentials — the marketing site (Webflow), the two product web
  apps (TrueTracts, TrueEngine), the two product API hosts, and the two Auth0 custom
  identity domains. Hosts were enumerated from the public site plus Certificate
  Transparency (api.certspotter.com, truefootage.tech + subdomains). Status is the
  HTTP code observed at fetch time. Only the two OpenID Connect discovery documents
  returned a real, correctly-typed payload; they are saved verbatim. Every other path
  answered a hard 404 or a 401 — no soft-200 HTML shells were credited as documents.
source: https://auth.truetracts.truefootage.tech/.well-known/openid-configuration
hosts:
  - host: https://auth.truetracts.truefootage.tech
    note: >-
      Auth0 custom identity domain fronting the TrueTracts appraiser console. The
      discovery document and JWKS are served anonymously; everything behind them
      requires a tenant login.
    documents:
      - path: /.well-known/openid-configuration
        status: 200
        type: application/json
        file: true-footage-truetracts-openid-configuration.json
      - path: /.well-known/oauth-authorization-server
        status: 200
        type: application/json
        note: identical payload to the openid-configuration document; not duplicated on disk
